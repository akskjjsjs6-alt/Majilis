  /* Shell */

  .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; cursor: pointer; }
  .brand .mark {
    width: 34px; height: 34px; border: 1.5px solid var(--brass); border-radius: 50%;

  .brand h1 em { color: var(--brass-bright); font-style: normal; }

  /* Animated neon "M" mark */
  .logo-base {
    fill: none; stroke: #003311; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
  }
  .logo-lit {
    fill: none; stroke: #00FF66; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 240.42; stroke-dashoffset: 240.42;
    animation: logoDraw 3.4s linear infinite;
    filter: url(#logoGlow);
  }
  .logo-flash {
    fill: none; stroke: #ecfff5; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 10 300;
    stroke-dashoffset: 240.42;
    animation: logoComet 3.4s linear infinite;
    filter: url(#logoFlashGlow);
  }
  @keyframes logoDraw {
    0%   { stroke-dashoffset: 240.42; opacity: 0; }
    1%   { opacity: 1; }
    40%  { stroke-dashoffset: 0; opacity: 1; }
    82%  { stroke-dashoffset: 0; opacity: 1; }
    90%  { stroke-dashoffset: 240.42; opacity: 1; }
    100% { stroke-dashoffset: 240.42; opacity: 0; }
  }
  @keyframes logoComet {
    0%   { stroke-dashoffset: 240.42; opacity: 1; }
    40%  { stroke-dashoffset: 0; opacity: 1; }
    42%  { opacity: 0; }
    100% { opacity: 0; }

  /* ===== Full-page splash / loading screen ===== */

  #splash-screen.splash-hide { opacity: 0; pointer-events: none; }

    filter: url(#splashRingGlow);

<script>
/* ================= STATE ================= */
function makeNewUserProfile(username, password, isGuest){
  return {
    username,
    password: password || null,
    isGuest: !!isGuest,
    name: username,
    readingElo: 0,
    readingPoints: 0,
    debatePoints: 0,
    insightPoints: 0,
    compass: null,
    archetype: null,
    ideologies: null,
    fallacyStats: { adHominem:0, strawman:0, goalpostShift:0, falseEquivalency:0, total:0 },
    guild: null,
    pagesRead: 0,
    booksFinished: 0,
    debateRank: null,
    placementTaken: false,
    forumPostsCount: 0,
    books: [],
    activeDebateId: null,
    avatar: null,
    bio: '',
    following: [],
    followers: [],
    blocked: [],
    notifications: [],
    settings: {
      profileVisibility: 'public',   // 'public' | 'private'
      showOnLeaderboard: true,
      allowFollowers: true,
    },
  };
}

const state = {
  tab: 'home',
  authMode: 'login',
  showAuth: false,
  exploreOpen: false,
  mobileNavOpen: false,
  theme: localStorage.getItem('theme') || 'light',
  cookieConsent: localStorage.getItem('cookieConsent') === 'true',
  searchQuery: '',
  loading: false,
  showPassword: false,
  currentUser: null,
  users: {},
  user: null,
  viewingProfile: null,
  quiz: {
    active: false,
    section: 'philosophy',
    index: 0,
    answers: [],
    written: '',
  },
  forumPage: 1,
  forumSort: 'new',
  forumOpenThread: null,
  debateQueue: { Text: [], Video: [] },
  debates: {},
  spectateDebates: [],
  forum: [],
  guilds: [],
  wiki: [],
  dms: {},          // conversationKey -> { messages: [{from,text,ts}] }
  reports: [],       // { by, target, reason, ts }
  memberSearch: '',
  activeDM: null,    // username of currently open conversation
  notifOpen: false,
};

// Initialize Theme
document.documentElement.setAttribute('data-theme', state.theme);

/* ================= PERSISTENCE ================= */
const SAVE_KEY = 'majlis_state_v1';

function saveState(){
  try {
    const persisted = {
      users: state.users,
      currentUser: state.currentUser,
      debateQueue: state.debateQueue,
      debates: state.debates,
      forum: state.forum,
      guilds: state.guilds,
      wiki: state.wiki,
      dms: state.dms,
      reports: state.reports,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(persisted));
  } catch(e) {
    console.warn('Could not save state:', e);
  }
}

function loadState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const persisted = JSON.parse(raw);
    state.users = persisted.users || {};
    Object.values(state.users).forEach(u => {
      if(!u.settings) u.settings = { profileVisibility: 'public', showOnLeaderboard: true, allowFollowers: true };
      if(!Array.isArray(u.following)) u.following = [];
      if(!Array.isArray(u.followers)) u.followers = [];
      if(!Array.isArray(u.blocked)) u.blocked = [];
      if(!Array.isArray(u.notifications)) u.notifications = [];
      if(typeof u.bio !== 'string') u.bio = '';
    });
    state.currentUser = persisted.currentUser || null;
    state.debateQueue = persisted.debateQueue || { Text: [], Video: [] };
    state.debates = persisted.debates || {};
    state.forum = normalizeForum(persisted.forum || []);
    state.guilds = persisted.guilds || [];
    state.wiki = persisted.wiki || [];
    state.dms = persisted.dms || {};
    state.reports = persisted.reports || [];
    if(state.currentUser && state.users[state.currentUser]){
      state.user = state.users[state.currentUser];
      return true;
    }
    return false;
  } catch(e) {
    console.warn('Could not load state:', e);
    return false;
  }
}

const hadSavedSession = loadState();

function toggleTheme() {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
}

function acceptCookies() {
  state.cookieConsent = true;
  localStorage.setItem('cookieConsent', 'true');
  render();
}

function switchToUser(username){
  state.currentUser = username;
  state.user = state.users[username];
  state.showAuth = false;
  state.tab = 'home';
}

let guestCounter = 0;
function startGuestSession(){
  guestCounter += 1;
  const username = 'Guest'+Math.floor(1000+Math.random()*9000)+(guestCounter>1?('-'+guestCounter):'');
  state.users[username] = makeNewUserProfile(username, null, true);
  switchToUser(username);
}

function logout(){
  startGuestSession();
  render();
}

/* ================= FOLLOW / FRIENDS / SETTINGS ================= */
function isFollowing(username){
  return !!(state.user.following || []).includes(username);
}

function areFriends(usernameA, usernameB){
  const a = state.users[usernameA], b = state.users[usernameB];
  if(!a || !b) return false;
  return (a.following||[]).includes(usernameB) && (b.following||[]).includes(usernameA);
}

function toggleFollow(targetUsername){
  if(state.user.isGuest){ alert('Create an account to follow people.'); return; }
  if(targetUsername === state.currentUser) return;
  const target = state.users[targetUsername];
  if(!target) return;
  if(isBlocked(targetUsername) || isBlockedBy(targetUsername)){
    alert('You can\'t follow this user.');
    return;
  }
  state.user.following = state.user.following || [];
  target.followers = target.followers || [];

  if(isFollowing(targetUsername)){
    state.user.following = state.user.following.filter(u => u !== targetUsername);
    target.followers = target.followers.filter(u => u !== state.currentUser);
  } else {
    if(target.settings && target.settings.allowFollowers === false){
      alert(target.name + ' is not accepting new followers right now.');
      return;
    }
    state.user.following.push(targetUsername);
    target.followers.push(state.currentUser);
    addNotification(targetUsername, {
      type: 'follow',
      text: state.user.name + ' started following you.',
      from: state.currentUser,
    });
  }
  saveState();
  render();
}

/* ================= NOTIFICATIONS ================= */
function addNotification(targetUsername, notif){
  const target = state.users[targetUsername];
  if(!target || targetUsername === state.currentUser) return;
  target.notifications = target.notifications || [];
  target.notifications.unshift({
    id: Date.now()+Math.random(),
    read: false,
    ts: Date.now(),
    ...notif,
  });
}

function unreadNotifCount(){
  return (state.user.notifications || []).filter(n=>!n.read).length;
}

function markAllNotifsRead(){
  (state.user.notifications || []).forEach(n=>n.read = true);
  saveState();
  render();
}

/* ================= BLOCK / REPORT ================= */
function isBlocked(username){
  return !!(state.user.blocked || []).includes(username);
}
function isBlockedBy(username){
  const them = state.users[username];
  return !!(them && (them.blocked||[]).includes(state.currentUser));
}

function toggleBlock(targetUsername){
  if(state.user.isGuest){ alert('Create an account to block people.'); return; }
  if(targetUsername === state.currentUser) return;
  const target = state.users[targetUsername];
  if(!target) return;
  state.user.blocked = state.user.blocked || [];
  if(isBlocked(targetUsername)){
    state.user.blocked = state.user.blocked.filter(u=>u!==targetUsername);
  } else {
    if(!confirm('Block '+target.name+'? They won\'t be able to follow or message you, and you\'ll stop following each other.')) return;
    state.user.blocked.push(targetUsername);
    // sever follow relationship both ways
    state.user.following = (state.user.following||[]).filter(u=>u!==targetUsername);
    state.user.followers = (state.user.followers||[]).filter(u=>u!==targetUsername);
    target.following = (target.following||[]).filter(u=>u!==state.currentUser);
    target.followers = (target.followers||[]).filter(u=>u!==state.currentUser);
  }
  saveState();
  render();
}

function reportUser(targetUsername){
  const target = state.users[targetUsername];
  if(!target) return;
  const reason = prompt('Tell us briefly why you\'re reporting '+target.name+':');
  if(reason === null) return;
  state.reports = state.reports || [];
  state.reports.push({ by: state.currentUser, target: targetUsername, reason: reason.trim(), ts: Date.now() });
  saveState();
  alert('Thanks — your report has been submitted for review.');
}

/* ================= MUTUALS ================= */
function getMutuals(username){
  if(username === state.currentUser) return [];
  const them = state.users[username];
  if(!them) return [];
  const myFollowing = state.user.following || [];
  const theirFollowers = them.followers || [];
  return myFollowing.filter(u => theirFollowers.includes(u) && u !== state.currentUser);
}

/* ================= DIRECT MESSAGES ================= */
function dmKey(a, b){ return [a,b].sort().join('::'); }

function getConversation(username){
  const key = dmKey(state.currentUser, username);
  return (state.dms[key] && state.dms[key].messages) || [];
}

function myConversations(){
  const prefix = '';
  return Object.keys(state.dms)
    .filter(k => k.split('::').includes(state.currentUser))
    .map(k => {
      const parts = k.split('::');
      const other = parts[0] === state.currentUser ? parts[1] : parts[0];
      const msgs = state.dms[k].messages || [];
      return { other, key: k, lastMsg: msgs[msgs.length-1] || null };
    })
    .filter(c => state.users[c.other])
    .sort((a,b) => (b.lastMsg ? b.lastMsg.ts : 0) - (a.lastMsg ? a.lastMsg.ts : 0));
}

function hasUnreadDM(username){
  const msgs = getConversation(username);
  return msgs.some(m => m.from === username && !m.read);
}

function totalUnreadDMs(){
  return myConversations().filter(c => hasUnreadDM(c.other)).length;
}

function openDM(username){
  state.activeDM = username;
  const msgs = getConversation(username);
  msgs.forEach(m => { if(m.from === username) m.read = true; });
  navigateWithLoading('messages');
}

function sendDM(toUsername, text){
  const trimmed = (text||'').trim();
  if(!trimmed) return;
  if(state.user.isGuest){ alert('Create an account to send messages.'); return; }
  if(isBlocked(toUsername) || isBlockedBy(toUsername)){ alert('You can\'t message this user.'); return; }
  const key = dmKey(state.currentUser, toUsername);
  state.dms[key] = state.dms[key] || { messages: [] };
  state.dms[key].messages.push({ from: state.currentUser, text: trimmed, ts: Date.now(), read: false });
  addNotification(toUsername, {
    type: 'dm',
    text: state.user.name + ' sent you a message.',
    from: state.currentUser,
  });
  saveState();
  render();
}

function viewProfile(username){
  state.viewingProfile = (username === state.currentUser) ? null : username;
  navigateWithLoading('profile');
}

function goToOwnProfile(){
  state.viewingProfile = null;
  navigateWithLoading('profile');
}

function updateSetting(key, value){
  state.user.settings = state.user.settings || {};
  state.user.settings[key] = value;
  saveState();
  render();
}

function updateDisplayName(newName){
  const trimmed = (newName || '').trim();
  state.user.name = trimmed || state.user.username;
  saveState();
  render();
}

function updateBio(newBio){
  state.user.bio = (newBio || '').trim().slice(0,280);
  saveState();
  render();
}

function handleAvatarUpload(file){
  if(!file) return;
  if(!file.type || !file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2, sy = (img.height - minSide) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
      state.user.avatar = canvas.toDataURL('image/jpeg', 0.85);
      saveState();
      render();
    };
    img.onerror = () => alert('Could not read that image.');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeAvatar(){
  state.user.avatar = null;
  saveState();
  render();
}

function navigateWithLoading(tabId) {
  state.loading = true;
  state.tab = tabId;
  state.exploreOpen = false;
  state.mobileNavOpen = false;
  render();
  setTimeout(() => {

function titleFor(list, n){
  const hit = list.find(t=> n>=t.min && n<=t.max);
  return hit ? hit.title : list[list.length-1].title;
}

/* ================= HELPERS ================= */
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k==='html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    if(typeof c==='string' || typeof c==='number'){ e.appendChild(document.createTextNode(String(c))); return; }
    if(Array.isArray(c)){ c.forEach(cc=>{ if(cc!=null) e.appendChild(typeof cc==='string'||typeof cc==='number' ? document.createTextNode(String(cc)) : cc); }); return; }
    e.appendChild(c);
  });
  return e;
}

function levelFromPoints(pts){ return Math.floor(pts/150)+1; }

function avatarNode(userOrUsername, size){
  size = size || 36;
  const user = typeof userOrUsername === 'string' ? state.users[userOrUsername] : userOrUsername;
  const displayName = user ? user.name : (typeof userOrUsername === 'string' ? userOrUsername : '?');
  if(user && user.avatar){
    return el('img', {class:'avatar-img', src: user.avatar, style:`width:${size}px;height:${size}px;`});
  }
  return el('div', {class:'avatar', style:`width:${size}px;height:${size}px;font-size:${Math.max(10,Math.round(size*0.4))}px;`},
    (displayName || '?').charAt(0).toUpperCase());
}

function normalizeForum(list){
  return list.map(p=>({
    id: p.id || (Date.now()+Math.random()),
    title: p.title,
    author: p.author,
    body: p.body,
    category: p.category || 'Discussion',
    createdAt: p.createdAt || Date.now(),
    views: typeof p.views === 'number' ? p.views : 0,
    replies: Array.isArray(p.replies) ? p.replies : [],
  }));
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now() - ts);
  const m = Math.floor(diff/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  const d = Math.floor(h/24);
  if(d < 7) return d+'d ago';
  return new Date(ts).toLocaleDateString();
}

/* ================= AUTH OVERLAY ================= */
function renderAuthOverlay(){
  const backdrop = el('div',{style:
    'position:fixed;inset:0;background:var(--modal-overlay);display:flex;align-items:center;justify-content:center;z-index:50;'});
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop){ state.showAuth=false; render(); } });

  const box = el('div',{style:'width:100%;max-width:380px;padding:24px;'});
  const isLogin = state.authMode === 'login';
  const card = el('div',{class:'card', style:'position:relative;'});
  
  card.appendChild(el('button',{class:'btn secondary', style:'position:absolute;top:14px;right:14px;padding:4px 10px;font-size:12px;', onclick:()=>{state.showAuth=false; render();}}, '✕'));
  card.appendChild(el('h3',{}, isLogin ? 'Log in' : 'Create an account'));
  card.appendChild(el('p',{style:'font-size:13px;color:var(--parchment-dim);margin-bottom:14px;'},
    'Optional — you can keep using Majlis as a guest. An account just lets you come back to the same profile.'));

  const userIn = el('input',{type:'text', placeholder:'Username'});
  const emailIn = el('input',{type:'email', placeholder:'Email'});
  const passIn = el('input',{type: state.showPassword ? 'text' : 'password', placeholder:'Password'});
  const passToggle = el('button', {class: 'pw-toggle', onclick: () => {
    state.showPassword = !state.showPassword;
    passIn.type = state.showPassword ? 'text' : 'password';
    passToggle.textContent = state.showPassword ? 'Hide' : 'Show';
  }}, state.showPassword ? 'Hide' : 'Show');

  card.appendChild(el('div',{class:'field'},[el('label',{},'Username'), userIn]));
  if(!isLogin){
    card.appendChild(el('div',{class:'field'},[el('label',{},'Email'), emailIn]));
  }
  card.appendChild(el('div',{class:'field'},[
    el('label',{},'Password'),
    el('div', {class: 'pw-wrapper'}, [passIn, passToggle])
  ]));

  const errorBox = el('div',{style:'color:var(--wine);font-size:13px;margin-bottom:10px;min-height:16px;'});
  card.appendChild(errorBox);

  // Container that will hold the "enter your verification code" step once triggered.
  const verifyBox = el('div',{style:'display:none;'});
  card.appendChild(verifyBox);

  function finishLocalSignup(u, p){
    const carryOver = state.user && state.user.isGuest ? state.user : null;
    const oldGuestUsername = carryOver ? state.currentUser : null;
    const profile = carryOver ? { ...carryOver } : makeNewUserProfile(u, p, false);
    profile.username = u;
    profile.password = p;
    profile.name = u;
    profile.isGuest = false;
    profile.emailVerified = true;
    state.users[u] = profile;
    if(oldGuestUsername && oldGuestUsername !== u) delete state.users[oldGuestUsername];
    switchToUser(u);
    render();
  }

  const mainBtn = el('button',{class:'btn', style:'width:100%;', onclick: async ()=>{
    const u = userIn.value.trim();
    const p = passIn.value;
    const em = emailIn.value.trim();
    if(!u || !p){ errorBox.textContent = 'Enter a username and password.'; return; }

    if(isLogin){
      const existing = state.users[u];
      if(!existing || existing.password !== p){ errorBox.textContent = 'No account with that username/password.'; return; }
      switchToUser(u);
      render();
      return;
    }

    // Signup flow
    if(state.users[u] && !state.users[u].isGuest){ errorBox.textContent = 'That username is taken.'; return; }
    if(!em){ errorBox.textContent = 'Enter an email to verify.'; return; }

    if(!window.Clerk){ errorBox.textContent = 'Verification service not loaded — try again in a moment.'; return; }

    try {
      mainBtn.disabled = true; mainBtn.textContent = 'Sending code...';
      await window.Clerk.load();
      const signUp = await window.Clerk.client.signUp.create({ emailAddress: em });
      await signUp.prepareEmailAddressVerification({ strategy: 'email_code' });

      // Swap UI into "enter the code we emailed you" mode
      userIn.parentElement.style.display = 'none';
      emailIn.parentElement.style.display = 'none';
      passIn.parentElement.parentElement.style.display = 'none';
      mainBtn.style.display = 'none';
      errorBox.textContent = '';

      verifyBox.style.display = 'block';
      verifyBox.innerHTML = '';
      verifyBox.appendChild(el('p',{style:'font-size:13px;color:var(--parchment-dim);margin-bottom:10px;'},
        'We emailed a verification code to '+em+'. Enter it below.'));
      const codeIn = el('input',{type:'text', placeholder:'Verification code'});
      verifyBox.appendChild(el('div',{class:'field'},[el('label',{},'Code'), codeIn]));
      const verifyErr = el('div',{style:'color:var(--wine);font-size:13px;margin-bottom:10px;min-height:16px;'});
      verifyBox.appendChild(verifyErr);
      const verifyBtn = el('button',{class:'btn', style:'width:100%;', onclick: async ()=>{
        const code = codeIn.value.trim();
        if(!code){ verifyErr.textContent = 'Enter the code from your email.'; return; }
        try {
          verifyBtn.disabled = true; verifyBtn.textContent = 'Verifying...';
          const result = await signUp.attemptEmailAddressVerification({ code });
          if(result.status === 'complete' || result.verifications?.emailAddress?.status === 'verified'){
            finishLocalSignup(u, p);
          } else {
            verifyErr.textContent = 'Code did not verify — check and try again.';
            verifyBtn.disabled = false; verifyBtn.textContent = 'Verify email';
          }
        } catch(err){
          verifyErr.textContent = (err && err.errors && err.errors[0] && err.errors[0].message) || 'Invalid code, try again.';
          verifyBtn.disabled = false; verifyBtn.textContent = 'Verify email';
        }
      }}, 'Verify email');
      verifyBox.appendChild(verifyBtn);
    } catch(err){
      mainBtn.disabled = false; mainBtn.textContent = 'Create account';
      errorBox.textContent = (err && err.errors && err.errors[0] && err.errors[0].message) || 'Could not send verification email.';
    }
  }}, isLogin ? 'Log in' : 'Create account');

  card.appendChild(mainBtn);

  box.appendChild(card);
  box.appendChild(el('div',{style:'text-align:center;margin-top:16px;font-size:13px;color:var(--parchment-dim);'},[
    isLogin ? 'New here? ' : 'Already have an account? ',
    el('a',{href:'#', style:'color:var(--brass-bright);cursor:pointer;', onclick:(e)=>{
      e.preventDefault();
      state.authMode = isLogin ? 'signup' : 'login';
      render();
    }}, isLogin ? 'Create an account' : 'Log in'),
  ]));

  backdrop.appendChild(box);
  return backdrop;
}

/* ================= SEARCH SYSTEM ================= */
function executeSearch(query) {
  state.searchQuery = query;
  if (!query.trim()) { render(); return; }
  
  const q = query.toLowerCase();
  const results = [];

  const pages = [
    { title: 'Home', tab: 'home' },
    { title: 'Reading Tracker', tab: 'reading' },
    { title: 'Placement Assessment', tab: 'assessment' },
    { title: 'Debate Lobby', tab: 'debate' },
    { title: 'Forum', tab: 'forum' },
    { title: 'Leaderboards', tab: 'leaderboard' },
    { title: 'Ranks Overview', tab: 'ranks' },
    { title: 'Political Compass', tab: 'compass' },
    { title: 'Guilds', tab: 'guilds' },
    { title: 'Wiki', tab: 'wiki' },
  ];

  pages.forEach(p => {
    if (p.title.toLowerCase().includes(q)) results.push({ label: 'Page: ' + p.title, tab: p.tab });
  });

  state.wiki.forEach(w => {
    if (w.title.toLowerCase().includes(q) || w.summary.toLowerCase().includes(q)) {
      results.push({ label: 'Wiki: ' + w.title, tab: 'wiki' });
    }
  });

  Object.values(state.users).forEach(u => {
    if (u.isGuest || u.username === state.currentUser) return;
    if (u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)) {
      results.push({ label: 'Person: ' + u.name, user: u.username });
    }
  });

  state.searchResults = results;
  render();
}

const LEANINGS = ['Left','Right','Center','Libertarian','Authoritarian','Traditionalist','Progressive','Classical','Anti-establishment'];
const CANONICAL_WEIGHT = [
  { pattern:/kant|hegel|heidegger|wittgenstein|husserl/i, weight: 2.2 },
  { pattern:/plato|aristotle|spinoza|kierkegaard|nietzsche/i, weight: 1.8 },
  { pattern:/hobbes|locke|rousseau|rawls|nozick|marx/i, weight: 1.5 },
  { pattern:/./, weight: 1.0 },
];

function stableHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function aiEvaluateBookElo(title, author, pages){
  const key = (title+' '+author).toLowerCase();
  const match = CANONICAL_WEIGHT.find(c=>c.pattern.test(key)) || CANONICAL_WEIGHT[CANONICAL_WEIGHT.length-1];
  const base = 4 + (pages/100)*3;
  const wobble = 0.85 + (stableHash(key) % 30)/100;
  const worth = Math.round(base * match.weight * wobble);
  return Math.max(2, worth);
}

function diversityScore(){
  const finished = state.user.books.filter(b=>b.status==='Finished');
  if(finished.length===0) return 0;
  const unique = new Set(finished.map(b=>b.leaning));
  return Math.round((unique.size/finished.length)*100);
}

const ARCHETYPES = ['Rationalist','Empiricist','Existentialist','Stoic','Utilitarian','Skeptic'];

const ECONOMIC_QUESTIONS = ECON_X_QUESTIONS.map(q=>({...q, axis:'x'})).concat(ECON_Y_QUESTIONS.map(q=>({...q, axis:'y'})));
const POLITICAL_QUESTIONS = POL_X_QUESTIONS.map(q=>({...q, axis:'x'})).concat(POL_Y_QUESTIONS.map(q=>({...q, axis:'y'})));
const SOCIAL_QUESTIONS = SOC_X_QUESTIONS.map(q=>({...q, axis:'x'})).concat(SOC_Y_QUESTIONS.map(q=>({...q, axis:'y'})));

const COMPASS_DEFS = {
  economic: {
    title: 'Economic Compass',
    xLabels: ['Left','Right'], yLabels: ['Interventionist','Laissez-faire'],
    quads: { tl:'Socialist', tr:'Corporatist', bl:'Communalist', br:'Free-Market Capitalist' },
  },
  political: {
    title: 'Political Compass',
    xLabels: ['Nationalist','Globalist'], yLabels: ['Authoritarian','Libertarian'],
    quads: { tl:'Nationalist-Authoritarian', tr:'Technocratic Globalist', bl:'Sovereigntist Libertarian', br:'Cosmopolitan Libertarian' },
  },
  social: {
    title: 'Social Compass',
    xLabels: ['Traditional','Progressive'], yLabels: ['Collectivist','Individualist'],
    quads: { tl:'Traditionalist Communitarian', tr:'Progressive Communitarian', bl:'Conservative Individualist', br:'Liberal Individualist' },
  },
};

function axisScoreToPct(sum, questionCount){
  const max = questionCount * 3;
  return Math.max(0, Math.min(100, Math.round(50 + (sum/max)*50)));
}

function computeAxisPair(answers, section){
  const secAnswers = answers.filter(a=>a.section===section);
  const bank = section==='economic' ? ECONOMIC_QUESTIONS : section==='political' ? POLITICAL_QUESTIONS : SOCIAL_QUESTIONS;
  let xSum = 0, xCount = 0, ySum = 0, yCount = 0;
  secAnswers.forEach(a=>{
    const q = bank.find(b=>b.q===a.q);
    if(!q) return;
    const optIndex = q.opts.indexOf(a.choice);
    if(optIndex === -1) return;
    const value = -3 + optIndex*2; // 0->-3, 1->-1, 2->1, 3->3
    if(q.axis==='x'){ xSum += value; xCount++; } else { ySum += value; yCount++; }
  });
  return {
    x: axisScoreToPct(xSum, xCount || 15),
    y: axisScoreToPct(ySum, yCount || 15),
  };
}

function computeThreeCompasses(answers){
  return {
    economic: computeAxisPair(answers, 'economic'),
    political: computeAxisPair(answers, 'political'),
    social: computeAxisPair(answers, 'social'),
  };
}

function deriveQuadrantIdeology(section, pair){
  const def = COMPASS_DEFS[section];
  const isRight = pair.x >= 50;
  const isTop = pair.y >= 50;
  if(isTop && !isRight) return def.quads.tl;
  if(isTop && isRight) return def.quads.tr;
  if(!isTop && !isRight) return def.quads.bl;
  return def.quads.br;
}

function deriveArchetype(answers){
  // Philosophical archetype, derived only from the philosophy section, independent of the three compasses.
  const philAnswers = answers.filter(a=>a.section==='philosophy');
  let epistemic = 0;
  philAnswers.forEach(a=>{
    const bank = PHIL_QUESTIONS.find(q=>q.q===a.q);
    if(!bank) return;
    const optIndex = bank.opts.indexOf(a.choice);
    if(optIndex === -1) return;
    epistemic += (2 - optIndex);
  });
  const freeWillAnswer = philAnswers.find(a=>/free will/i.test(a.q));
  const moralityAnswer = philAnswers.find(a=>/morality discovered/i.test(a.q));

  if(epistemic <= -8) return 'Empiricist';
  if(moralityAnswer && /Invented/i.test(moralityAnswer.choice)) return 'Existentialist';
  if(freeWillAnswer && /incoherent/i.test(freeWillAnswer.choice)) return 'Skeptic';
  if(epistemic >= 20) return 'Rationalist';
  if(epistemic >= 8) return 'Utilitarian';
  return 'Stoic';
}

function finishAssessment(viewText){
  const depthScore = Math.min(100, Math.round((viewText.length/6)));
  const baseRank = 6 + Math.round(depthScore/12);
  state.user.debateRank = Math.max(1, Math.min(20, baseRank));
  state.user.placementTaken = true;
  const compass = computeThreeCompasses(state.quiz.answers);
  state.user.compass = compass;
  state.user.archetype = deriveArchetype(state.quiz.answers);
  state.user.ideologies = {
    economic: deriveQuadrantIdeology('economic', compass.economic),
    political: deriveQuadrantIdeology('political', compass.political),
    social: deriveQuadrantIdeology('social', compass.social),
  };
  state.quiz.active = false;
  state.tab = 'assessment';
  render();
}

function genId(){ return 'd'+Math.random().toString(36).slice(2,10); }
function otherParticipant(debate){ return debate.participants.find(u=>u!==state.currentUser); }

function tryMatchQueue(mode){
  const q = state.debateQueue[mode];
  const me = state.currentUser;
  const myEntry = q.find(e=>e.username===me);
  if(!myEntry) return;
  const isUnranked = myEntry.unranked;
  const myRank = state.users[me].debateRank;

  const matchIndex = q.findIndex(e=>{
    if(e.username===me) return false;
    if(e.unranked !== isUnranked) return false;
    if(isUnranked) return true;
    return Math.abs(state.users[e.username].debateRank - myRank) <= 2;
  });

  if(matchIndex === -1) return;
  const oppEntry = q[matchIndex];
  state.debateQueue[mode] = q.filter(e=>e.username!==me && e.username!==oppEntry.username);

  const id = genId();
  const debate = {
    id, mode, topic: myEntry.topic || 'Open topic', unranked: isUnranked,
    participants: [me, oppEntry.username], chatLog: [], verdict: null, status: 'active',
  };
  state.debates[id] = debate;
  state.users[me].activeDebateId = id;
  state.users[oppEntry.username].activeDebateId = id;
}

function queueForMatch(mode, topic, unranked){
  const q = state.debateQueue[mode];
  if(!q.find(e=>e.username===state.currentUser)){
    q.push({ username: state.currentUser, topic, unranked: !!unranked });
  }
  tryMatchQueue(mode);
  render();
}

function cancelQueue(mode){
  state.debateQueue[mode] = state.debateQueue[mode].filter(e=>e.username!==state.currentUser);
  render();
}

const FALLACY_PATTERNS = [
  { key: 'adHominem', label: 'Ad hominem', pattern: /\b(you'?re|you are)\s+(an?\s+)?(idiot|stupid|dumb|moron|fool|clown|liar)\b|\byou always\b|\btypical of someone like you\b/i },
  { key: 'strawman', label: 'Strawman', pattern: /\bso you'?re saying\b|\bwhat you'?re really saying is\b|\bso basically you want\b/i },
  { key: 'goalpostShift', label: 'Goalpost shift', pattern: /\bthat'?s not what i meant\b|\bi never said that\b|\bmoving on from that\b/i },
  { key: 'falseEquivalency', label: 'False equivalence', pattern: /\bthat'?s the same as\b|\bjust like\b.*\bso it'?s equally\b|\bno different from\b/i },
];

function evaluateArgumentQuality(text){
  if(!text) return 0;
  const words = text.trim().split(/\s+/).filter(Boolean);
  const wordCount = words.length;
  const sentences = text.split(/[.!?]+/).filter(s=>s.trim().length>0);
  const avgSentenceLen = sentences.length ? wordCount/sentences.length : 0;
  const hasReasoningMarkers = /\b(because|therefore|however|suppose|if.*then|it follows|for example|on the other hand|consequently)\b/i.test(text);
  const hasQuestion = /\?/.test(text);

  let score = 0;
  score += Math.min(40, wordCount * 0.4);
  score += avgSentenceLen > 6 && avgSentenceLen < 35 ? 15 : 5;
  score += hasReasoningMarkers ? 20 : 0;
  score += hasQuestion ? 5 : 0;
  return Math.round(score);
}

function detectFallacies(text){
  const hits = [];
  FALLACY_PATTERNS.forEach(f=>{
    if(f.pattern.test(text)) hits.push(f.key);
  });
  return hits;
}

function judgeDebate(debate){
  const [p1, p2] = debate.participants;
  const scores = { [p1]: 0, [p2]: 0 };
  const fallaciesFound = { [p1]: [], [p2]: [] };
  const msgCount = { [p1]: 0, [p2]: 0 };

  debate.chatLog.forEach(m=>{
    const q = evaluateArgumentQuality(m.text);
    const fallacies = detectFallacies(m.text);
    scores[m.author] = (scores[m.author]||0) + q - (fallacies.length * 12);
    fallaciesFound[m.author] = (fallaciesFound[m.author]||[]).concat(fallacies);
    msgCount[m.author] = (msgCount[m.author]||0) + 1;
  });

  // Responsiveness bonus: reward alternating exchange over one-sided monologue
  [p1, p2].forEach(u=>{
    if(msgCount[u] >= 2) scores[u] += 8;
  });

  let winner;
  if(msgCount[p1] === 0 && msgCount[p2] === 0){
    winner = null; // no-contest, nobody argued
  } else {
    winner = scores[p1] >= scores[p2] ? p1 : p2;
  }

  return { scores, fallaciesFound, winner, msgCount };
}

function applyFallacyStats(username, fallacyKeys){
  const profile = state.users[username];
  if(!profile) return;
  fallacyKeys.forEach(key=>{
    profile.fallacyStats[key] = (profile.fallacyStats[key]||0) + 1;
    profile.fallacyStats.total = (profile.fallacyStats.total||0) + 1;
  });
}

function applyDebateResult(debate, result){
  const { winner, scores } = result;
  const [p1, p2] = debate.participants;

  [p1, p2].forEach(u=>{
    applyFallacyStats(u, result.fallaciesFound[u] || []);
  });

  if(winner === null){
    return; // no-contest: no points, no rank change
  }

  const loser = winner === p1 ? p2 : p1;
  const winnerProfile = state.users[winner];
  const loserProfile = state.users[loser];

  const margin = Math.abs((scores[p1]||0) - (scores[p2]||0));
  const insightGain = Math.min(15, Math.round(margin/4));

  winnerProfile.debatePoints = (winnerProfile.debatePoints||0) + 10;
  winnerProfile.insightPoints = (winnerProfile.insightPoints||0) + insightGain;
  loserProfile.debatePoints = (loserProfile.debatePoints||0) + 3;

  if(!debate.unranked){
    const winnerRank = winnerProfile.debateRank || 1;
    const loserRank = loserProfile.debateRank || 1;
    const rankGap = loserRank - winnerRank;
    const kFactor = 1;
    const winnerDelta = Math.max(0, Math.round(kFactor * (1 + rankGap*0.2)));
    const loserDelta = Math.max(0, Math.round(kFactor * (1 - rankGap*0.2)));
    winnerProfile.debateRank = Math.max(1, Math.min(20, winnerRank + Math.max(1, winnerDelta)));
    loserProfile.debateRank = Math.max(1, Math.min(20, loserRank - Math.max(0, loserDelta)));
  }

  if(!winnerProfile.debateHistory) winnerProfile.debateHistory = [];
  if(!loserProfile.debateHistory) loserProfile.debateHistory = [];
  winnerProfile.debateHistory.unshift({ topic: debate.topic, mode: debate.mode, result: 'win', opponent: loser, unranked: debate.unranked });
  loserProfile.debateHistory.unshift({ topic: debate.topic, mode: debate.mode, result: 'loss', opponent: winner, unranked: debate.unranked });
}

function endDebate(debateId){
  const debate = state.debates[debateId];
  const result = judgeDebate(debate);
  applyDebateResult(debate, result);
  debate.verdict = {
    winner: result.winner,
    unranked: debate.unranked,
    scores: result.scores,
    fallaciesFound: result.fallaciesFound,
  };
  debate.status = 'ended';
  render();
}

  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if(state.forumPage > totalPages) state.forumPage = totalPages;
  const start = (state.forumPage - 1) * PAGE_SIZE;

  const list = el('div',{class:'thread-list'});
  sorted.slice(start, start + PAGE_SIZE).forEach(p=>{
    const lastActivity = p.replies.length ? p.replies[p.replies.length-1] : null;
    const row = el('div',{class:'thread-row', onclick:()=>openThread(p.id)},[
      avatarNode(p.author, 38),

        el('div',{class:'t-num'},[el('b',{}, p.views||0), el('span',{},'Views')]),
      ]),
      el('div',{class:'t-last'},[
        avatarNode(lastActivity ? lastActivity.author : p.author, 28),
        el('div',{class:'t-last-info'},[
          el('span',{class:'t-last-who'}, lastActivity ? lastActivity.author : p.author),
          el('span',{class:'t-last-time'}, timeAgo(lastActivity ? lastActivity.createdAt : p.createdAt)),

    if(state.forumOpenThread === p.id){
      list.appendChild(renderThreadDetail(p));
    }
  });
  wrap.appendChild(list);

  if(totalPages > 1){
    const pager = el('div',{style:'display:flex;justify-content:center;gap:10px;align-items:center;margin-top:14px;'});
    pager.appendChild(el('button',{class:'btn secondary', style: state.forumPage<=1?'opacity:0.4;pointer-events:none;':'', onclick:()=>{ state.forumPage--; render(); }}, '← Prev'));
    pager.appendChild(el('span',{style:'font-size:13px;color:var(--parchment-dim);'}, 'Page '+state.forumPage+' of '+totalPages));
    pager.appendChild(el('button',{class:'btn secondary', style: state.forumPage>=totalPages?'opacity:0.4;pointer-events:none;':'', onclick:()=>{ state.forumPage++; render(); }}, 'Next →'));
    wrap.appendChild(pager);
  }

  return wrap;
}

    wrap.appendChild(el('div',{class:'divider'}));
  }

  if(!state.guilds.length){
    wrap.appendChild(el('p',{class:'empty-note'},'No guilds founded yet. Be the first.'));
    return wrap;
  }

  state.guilds.forEach(g=>{
    const totals = guildTotals(g.name);
    const card = el('div',{class:'forum-post'});
    card.appendChild(el('h4',{}, g.name));
    card.appendChild(el('div',{class:'meta'}, 'Founded by '+g.founder+' · '+totals.memberCount+' members'));
    if(g.description) card.appendChild(el('p',{}, g.description));
    if(state.user.guild !== g.name && !state.user.isGuest){
      card.appendChild(el('button',{class:'btn secondary', style:'margin-top:8px;', onclick:()=>joinGuild(g.name)},'Join'));
    }
    wrap.appendChild(card);
  });

  return wrap;
}

function renderProfile(){

    return renderOtherProfile(state.viewingProfile);
  }
  return renderOwnProfile();
}

function connectionsList(usernames, emptyText, opts={}){
  const box = el('div',{});
  if(!usernames.length){
    box.appendChild(el('p',{class:'empty-note'}, emptyText));
    return box;
  }
  usernames.forEach(uname=>{
    const person = state.users[uname];
    if(!person) return;
    const row = el('div',{class:'book-row'},[
      el('div',{style:'display:flex;align-items:center;gap:10px;'},[
        avatarNode(person, 30),
        el('button',{class:'user-link', onclick:()=>viewProfile(uname)}, person.name),
        areFriends(state.currentUser, uname) ? el('span',{class:'friend-badge'},'Friends') : null,
      ]),
    ]);
    if(opts.unfollowable){
      row.appendChild(el('button',{class:'btn secondary', style:'padding:4px 12px;font-size:12px;', onclick:()=>toggleFollow(uname)}, 'Unfollow'));
    } else if(opts.followBack){
      row.appendChild(el('button',{class:'btn secondary', style:'padding:4px 12px;font-size:12px;', onclick:()=>toggleFollow(uname)},
        isFollowing(uname) ? 'Following' : 'Follow back'));
    }
    box.appendChild(row);
  });
  return box;
}

function renderOtherProfile(username){
  const wrap = el('div',{});

  if(!person){
    wrap.appendChild(el('h2',{class:'section-title'},'User not found'));
    wrap.appendChild(el('button',{class:'btn secondary', onclick: goToOwnProfile},'Back to your profile'));
    return wrap;
  }

  const titleRow = el('div',{class:'profile-header-row'},[
    avatarNode(person, 76),
    el('div',{class:'name-with-avatar'},[
      el('h2',{class:'section-title', style:'margin:0;'}, person.name),
      areFriends(state.currentUser, username) ? el('span',{class:'friend-badge'},'Friends') : null,
    ]),
  ]);
  wrap.appendChild(titleRow);
  wrap.appendChild(el('p',{class:'section-sub'}, (person.guild ? 'Guild: '+person.guild : 'No guild') + ' · ' +
    (person.followers||[]).length + ' followers · ' + (person.following||[]).length + ' following'));

  if(person.bio){
    wrap.appendChild(el('p',{class:'bio-text', style:'margin-top:-14px;margin-bottom:14px;max-width:520px;'}, person.bio));
  }

  const blockedByMe = isBlocked(username);
  const blockedByThem = isBlockedBy(username);

  if(!state.user.isGuest && !blockedByMe && !blockedByThem){
    const mutuals = getMutuals(username);
    if(mutuals.length){
      wrap.appendChild(el('div',{class:'mutuals-row'},[
        'Followed by ',
        mutuals.slice(0,3).map((mu,i)=> el('span',{},[
          el('button',{class:'user-link', style:'font-size:12.5px;', onclick:()=>viewProfile(mu)}, state.users[mu]?state.users[mu].name:mu),
          i < Math.min(mutuals.length,3)-1 ? ', ' : '',
        ])),
        mutuals.length>3 ? (' and '+(mutuals.length-3)+' more you follow') : (mutuals.length>1 ? ' — people you follow' : ' — someone you follow'),
      ]));
    }
  }

  wrap.appendChild(el('div',{style:'height:14px'}));

  if(blockedByMe){
    wrap.appendChild(el('div',{class:'blocked-banner'}, 'You have blocked '+person.name+'. Unblock them to interact again.'));
    wrap.appendChild(el('button',{class:'btn secondary', onclick:()=>toggleBlock(username)}, 'Unblock'));
    return wrap;
  }
  if(blockedByThem){
    wrap.appendChild(el('div',{class:'blocked-banner'}, 'This profile is unavailable.'));
    return wrap;
  }

  const actionRow = el('div',{style:'display:flex;gap:10px;flex-wrap:wrap;'});
  if(!state.user.isGuest){
    actionRow.appendChild(el('button',{
      class: isFollowing(username) ? 'btn secondary' : 'btn',
      onclick: ()=>toggleFollow(username)
    }, isFollowing(username) ? 'Following' : 'Follow'));
    actionRow.appendChild(el('button',{class:'btn secondary', onclick:()=>openDM(username)}, 'Message'));
    actionRow.appendChild(el('button',{class:'btn secondary', style:'color:var(--wine);border-color:var(--wine);', onclick:()=>toggleBlock(username)}, 'Block'));
    actionRow.appendChild(el('button',{class:'btn secondary', onclick:()=>reportUser(username)}, 'Report'));
  }
  wrap.appendChild(actionRow);
  wrap.appendChild(el('div',{style:'height:22px'}));

  const isPrivate = person.settings && person.settings.profileVisibility === 'private';
  if(isPrivate){
    wrap.appendChild(el('div',{class:'card'},[
      el('h3',{},'This profile is private'),
      el('p',{},'Only the name and connection counts above are visible.'),
    ]));
    return wrap;
  }

  const grid = el('div',{class:'grid grid-3'});
  grid.appendChild(statCard('Reading Elo', person.readingElo||0));
  grid.appendChild(statCard('Debate Rank', person.debateRank ? '#'+person.debateRank : '—'));
  grid.appendChild(statCard('Guild', person.guild || 'None'));
  wrap.appendChild(grid);

  return wrap;
}

function segControl(options, currentValue, onChange){
  return el('div',{class:'seg-control'}, options.map(([val,label])=>
    el('button',{
      class: 'sort-chip' + (currentValue===val ? ' active' : ''),
      onclick: ()=>onChange(val)
    }, label)
  ));
}

function renderMembers(){

  const q = (state.memberSearch||'').toLowerCase().trim();
  const all = Object.values(state.users).filter(u=>!u.isGuest && u.username!==state.currentUser);
  const filtered = q ? all.filter(u => u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q)) : all;

  const card = el('div',{class:'card'});
  if(!filtered.length){
    card.appendChild(el('p',{class:'empty-note'}, all.length ? 'No members match your search.' : 'No other members yet — invite some friends.'));
  } else {
    filtered.forEach(person=>{
      const blockedByMe = isBlocked(person.username);
      const blockedByThem = isBlockedBy(person.username);
      const row = el('div',{class:'member-row'},[
        avatarNode(person, 42),
        el('div',{},[
          el('button',{class:'user-link', onclick:()=>viewProfile(person.username)}, person.name),
          el('div',{style:'font-size:12px;color:var(--parchment-dim);'}, '@'+person.username +
            (areFriends(state.currentUser, person.username) ? ' · Friends' : '')),

      ]);
      const actions = el('div',{class:'member-actions'});
      if(!state.user.isGuest && !blockedByMe && !blockedByThem){
        actions.appendChild(el('button',{
          class: isFollowing(person.username) ? 'btn secondary' : 'btn',

          onclick: ()=>toggleFollow(person.username),

function renderNotifications(){

function renderMessages(){
  const wrap = el('div',{});
  wrap.appendChild(el('h2',{class:'section-title'},'Messages'));
  wrap.appendChild(el('p',{class:'section-sub'},'Direct conversations with other members.'));

  if(state.user.isGuest){
    wrap.appendChild(el('div',{class:'card'},[
      el('h3',{},'Create an account to message people'),
      el('p',{},'Guests can browse Majlis but need an account to send and receive direct messages.'),
    ]));
    return wrap;
  }

  const convos = myConversations();
  const activeUser = state.activeDM && state.users[state.activeDM] ? state.activeDM : (convos[0] ? convos[0].other : null);

  const convoList = el('div',{class:'dm-convo-list'});
  if(!convos.length){
    convoList.appendChild(el('div',{style:'padding:16px;'}, el('p',{class:'empty-note', style:'padding:0;'}, 'No conversations yet. Message someone from their profile or the Members page.')));
  } else {
    convos.forEach(c=>{
      const person = state.users[c.other];
      if(!person) return;
      const preview = c.lastMsg ? ((c.lastMsg.from===state.currentUser?'You: ':'')+c.lastMsg.text) : '';
      const item = el('div',{class:'dm-convo-item'+(c.other===activeUser?' active':''), onclick:()=>openDM(c.other)},[
        avatarNode(person, 36),
        el('div',{style:'min-width:0;flex:1;'},[
          el('div',{class:'dm-convo-name'}, person.name + (hasUnreadDM(c.other) ? ' ●' : '')),
          el('div',{class:'dm-convo-preview'}, preview),
        ]),
      ]);
      convoList.appendChild(item);
    });
  }

  const threadWrap = el('div',{class:'dm-thread'});
  if(!activeUser || !state.users[activeUser]){
    threadWrap.appendChild(el('div',{class:'dm-empty'}, 'Select a conversation to start chatting.'));
  } else {
    const person = state.users[activeUser];
    const blockedByMe = isBlocked(activeUser);
    const blockedByThem = isBlockedBy(activeUser);

    threadWrap.appendChild(el('div',{class:'dm-thread-header'},[
      avatarNode(person, 32),
      el('button',{class:'user-link', onclick:()=>viewProfile(activeUser)}, person.name),
    ]));

    const msgsBox = el('div',{class:'dm-messages'});
    const msgs = getConversation(activeUser);
    msgs.forEach(m=>{
      msgsBox.appendChild(el('div',{class:'dm-bubble '+(m.from===state.currentUser?'me':'them')},[
        el('div',{}, m.text),
        el('div',{class:'dm-bubble-time'}, timeAgo(m.ts)),
      ]));
    });
    threadWrap.appendChild(msgsBox);

    if(blockedByMe || blockedByThem){
      threadWrap.appendChild(el('div',{class:'blocked-banner', style:'margin:12px 16px;'},
        blockedByMe ? 'You\'ve blocked '+person.name+'. Unblock them to keep messaging.' : 'You can\'t message this user.'));
    } else {
      const textIn = el('textarea',{placeholder:'Write a message...'});
      const sendBtn = el('button',{class:'btn', onclick:()=>{
        sendDM(activeUser, textIn.value);
        textIn.value = '';
      }}, 'Send');
      textIn.addEventListener('keydown',(e)=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendBtn.click(); }
      });
      threadWrap.appendChild(el('div',{class:'dm-input-row'},[textIn, sendBtn]));
    }
  }

  wrap.appendChild(el('div',{class:'dm-layout'},[convoList, threadWrap]));
  return wrap;
}

function renderWiki(){

  wrap.appendChild(el('p',{class:'section-sub'},'Community summaries and conceptual breakdowns. Anyone can contribute an article.'));

  const createCard = el('div',{class:'card'});
  createCard.appendChild(el('h3',{},'Write an article'));
  const titleIn = el('input',{type:'text', placeholder:'Article title (e.g. "Categorical Imperative")'});
  const summaryIn = el('textarea',{placeholder:'One or two sentence summary shown in search results...'});
  const bodyIn = el('textarea',{placeholder:'Full article body...', style:'min-height:160px;'});
  createCard.appendChild(el('div',{class:'field'},[el('label',{},'Title'), titleIn]));
  createCard.appendChild(el('div',{class:'field'},[el('label',{},'Summary'), summaryIn]));
  createCard.appendChild(el('div',{class:'field'},[el('label',{},'Body'), bodyIn]));
  createCard.appendChild(el('button',{class:'btn', onclick:()=>{
    const title = titleIn.value.trim();
    const summary = summaryIn.value.trim();
    const body = bodyIn.value.trim();
    if(!title || !summary || !body){ alert('Fill in title, summary, and body.'); return; }
    if(state.wiki.find(w=>w.title.toLowerCase()===title.toLowerCase())){ alert('An article with that title already exists.'); return; }
    state.wiki.unshift({ title, summary, body, author: state.currentUser });
    render();
  }},'Publish article'));

  wrap.appendChild(el('div',{class:'divider'}));

  if(!state.wiki.length){
    wrap.appendChild(el('p',{class:'empty-note'},'No articles published yet. Be the first to contribute.'));
    return wrap;
  }

  state.wiki.forEach(w=>{
    const card = el('div',{class:'forum-post'});
    card.appendChild(el('h4',{}, w.title));
    card.appendChild(el('div',{class:'meta'}, 'by '+w.author));
    card.appendChild(el('p',{style:'font-style:italic;color:var(--parchment-dim);'}, w.summary));
    card.appendChild(el('p',{}, w.body));
    wrap.appendChild(card);
  });

  return wrap;
}

/* ================= INIT ================= */
render();
</script>
</body>
</html>
