<div id="splash-screen">
  <div class="splash-ring-wrap">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="splashRingGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur1"/>
            <feMergeNode in="blur2"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="splashMGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1"/>
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur1"/>
            <feMergeNode in="blur2"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <circle class="splash-ring-base" cx="100" cy="100" r="85"/>
      <circle class="splash-ring-progress" cx="100" cy="100" r="85"/>
      <path class="splash-m-base" d="M 55,140 L 55,60 L 100,105 L 145,60 L 145,140"/>
      <path class="splash-m-lit" d="M 55,140 L 55,60 L 100,105 L 145,60 L 145,140"/>

<div id="app"></div>
<script>
  window.__splashStart = Date.now();
  window.hideSplash = function () {
    var elapsed = Date.now() - window.__splashStart;
    var wait = Math.max(0, 500 - elapsed); // small floor so the animation doesn't just flash — not an artificial multi-second wait
    setTimeout(function () {
      var splash = document.getElementById('splash-screen');
      if (!splash) return;
      document.body.classList.add('app-ready'); // reveal the app at the same moment the splash fades
      splash.classList.add('splash-hide');
      setTimeout(function () { splash.remove(); }, 650);
    }, wait);
  };
  // Safety net: if something goes wrong and the app never signals ready, don't leave the splash stuck forever.
  setTimeout(function () { if (document.getElementById('splash-screen')) window.hideSplash(); }, 8000);
</script>
